<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozy Kitchen AI / Домашний Шеф</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FDFBF7;
      --surface: #FFFFFF;
      --terracotta: #C85A32;
      --terracotta-dark: #A94420;
      --olive: #5B7053;
      --olive-light: #EBF0E9;
      --text-main: #2D2A26;
      --text-muted: #736E65;
      --border-subtle: #EFE9DF;
      --shadow-warm: 0 12px 32px rgba(92, 64, 45, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-cream);
      background-image: radial-gradient(#E8E0D2 0.75px, transparent 0.75px);
      background-size: 16px 16px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .app-card {
      width: 100%;
      max-width: 620px;
      height: 92vh;
      background: var(--surface);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-warm);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
    }
    .app-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FAF7F2;
    }
    .chef-badge { display: flex; align-items: center; gap: 12px; }
    .chef-avatar {
      width: 44px;
      height: 44px;
      background: var(--olive-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border: 2px solid #DCE5D8;
    }
    .chef-info h1 {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
    }
    .chef-status {
      font-size: 12px;
      color: var(--olive);
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
    }
    .status-dot { width: 7px; height: 7px; background: var(--olive); border-radius: 50%; }
    .lang-toggle {
      background: var(--surface);
      border: 1.5px solid var(--border-subtle);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .chat-flow {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg-row { display: flex; gap: 10px; align-items: flex-start; max-width: 90%; }
    .msg-row.bot { align-self: flex-start; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-bubble {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .msg-row.bot .msg-bubble {
      background: #F8F5F0;
      color: var(--text-main);
      border-top-left-radius: 4px;
      border: 1px solid #ECE4D8;
    }
    .msg-row.user .msg-bubble {
      background: var(--terracotta);
      color: white;
      border-top-right-radius: 4px;
    }
    .choice-group { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .choice-btn {
      background: var(--surface);
      border: 1.5px solid var(--terracotta);
      color: var(--terracotta);
      padding: 8px 14px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
    }
    .choice-btn:hover { background: var(--terracotta); color: white; }
    .chat-bottom {
      padding: 16px 20px;
      border-top: 1px solid var(--border-subtle);
      background: var(--surface);
      display: flex;
      gap: 10px;
    }
    .food-input {
      flex: 1;
      padding: 12px 18px;
      border: 1.5px solid var(--border-subtle);
      border-radius: 14px;
      outline: none;
      font-size: 14.5px;
      font-family: inherit;
      background: #FAF8F5;
    }
    .submit-btn {
      background: var(--terracotta);
      color: white;
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 18px;
    }
    .submit-btn:disabled { background: #D9D2C7; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="app-card">
  <header class="app-header">
    <div class="chef-badge">
      <div class="chef-avatar">👨‍🍳</div>
      <div class="chef-info">
        <h1 id="chef-name">Шеф Оливер</h1>
        <div class="chef-status">
          <span class="status-dot"></span>
          <span id="status-label">На кухне</span>
        </div>
      </div>
    </div>
    <button class="lang-toggle" onclick="switchLanguage()">🇬🇧 English</button>
  </header>

  <main class="chat-flow" id="chatArea"></main>

  <footer class="chat-bottom">
    <input type="text" id="foodInput" class="food-input" placeholder="Перечислите продукты через запятую..." disabled />
    <button id="sendAction" class="submit-btn" onclick="sendPrompt()" disabled>➔</button>
  </footer>
</div>

<script>
  let lang = 'ru';
  let categoryKey = '';
  let categoryLabel = '';

  const ui = {
    ru: {
      name: "Шеф Оливер",
      status: "На кухне",
      welcome: "Приветствую! Заглянули в холодильник и не знаете, что приготовить? С удовольствием подскажу пару домашних идей.\n\nКакое блюдо приготовим?",
      btn1: "🍲 Первое блюдо",
      btn2: "🍛 Второе блюдо",
      btn3: "🥗 Вегетарианское (строго)",
      selectedMsg: "Отличный выбор: ",
      promptMsg: "Напишите от 3 до 5 основных ингредиентов, которые есть под рукой:",
      placeholder: "Например: тофу, брокколи, шампиньоны, рис...",
      waiting: "🥄 Уже нарезаем идеи... Подбираю 3 рецепта до 1 часа.",
      reset: "🔄 Выбрать другую категорию",
      toggleBtn: "🇬🇧 English"
    },
    en: {
      name: "Chef Oliver",
      status: "In the Kitchen",
      welcome: "Hello! Peeking into your fridge wondering what to cook? Let me share a few cozy home recipes with you.\n\nWhat kind of dish would you like?",
      btn1: "🍲 Soup / First Course",
      btn2: "🍛 Main Dish",
      btn3: "🥗 Strictly Vegetarian",
      selectedMsg: "Great choice: ",
      promptMsg: "List 3 to 5 ingredients you currently have on hand:",
      placeholder: "E.g., tofu, broccoli, mushrooms, rice...",
      waiting: "🥄 Cooking up ideas... Crafting 3 recipes (under 1 hour).",
      reset: "🔄 Choose another category",
      toggleBtn: "🇷🇺 Русский"
    }
  };

  const chat = document.getElementById('chatArea');
  const input = document.getElementById('foodInput');
  const sendBtn = document.getElementById('sendAction');
  const chefName = document.getElementById('chef-name');
  const statusLabel = document.getElementById('status-label');
  const toggleBtn = document.querySelector('.lang-toggle');

  function renderBotMessage(text, choices = []) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerText = text;

    if (choices.length > 0) {
      const group = document.createElement('div');
      group.className = 'choice-group';
      choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = c.label;
        btn.onclick = () => {
          if (c.action === 'reset') setupChat();
          else handleChoice(c.action, c.label);
        };
        group.appendChild(btn);
      });
      bubble.appendChild(group);
    }

    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function renderUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerText = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function setupChat() {
    chat.innerHTML = '';
    chefName.innerText = ui[lang].name;
    statusLabel.innerText = ui[lang].status;
    toggleBtn.innerText = ui[lang].toggleBtn;
    input.placeholder = ui[lang].placeholder;
    input.disabled = true;
    sendBtn.disabled = true;

    renderBotMessage(ui[lang].welcome, [
      { label: ui[lang].btn1, action: 'soup' },
      { label: ui[lang].btn2, action: 'main' },
      { label: ui[lang].btn3, action: 'vegetarian' }
    ]);
  }

  function handleChoice(type, label) {
    categoryKey = type;
    categoryLabel = label;
    renderUserMessage(label);
    renderBotMessage(`${ui[lang].selectedMsg} ${categoryLabel}.\n\n${ui[lang].promptMsg}`);
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }

  async function sendPrompt() {
    const ingredients = input.value.trim();
    if (!ingredients) return;

    renderUserMessage(ingredients);
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;

    renderBotMessage(ui[lang].waiting);

    let strictDietRule = "";
    if (categoryKey === 'vegetarian') {
      strictDietRule = "CRITICAL DIETARY RESTRICTION: The recipes MUST BE 100% STRICT VEGETARIAN. Absolutely NO meat, poultry, fish, seafood, gelatin, or animal broths allowed. Eggs and dairy are permitted only if requested, otherwise keep it plant-focused.";
    }

    const systemPrompt = `You are Chef Oliver, a friendly, warm home-cooking expert.
The user requested 3 recipes of category "${categoryLabel}" made from these ingredients: "${ingredients}".

${strictDietRule}

Strict guidelines:
- Maximum cooking time for any recipe must be 60 minutes or less.
- Structure:
  1. ⚡ Quick & Simple (15–20 min)
  2. ⏳ Balanced Comfort (30–40 min)
  3. 👨‍🍳 Chef's Choice (45–60 min, strictly not exceeding 1 hour)
- Tone: warm, encouraging, clear.
- Format per recipe: Title, Time estimate, Key steps.
- Response Language: ${lang === 'ru' ? 'Russian' : 'English'}.`;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: systemPrompt })
      });
      const data = await res.json();
      chat.removeChild(chat.lastChild);

      if (data.choices && data.choices[0]) {
        renderBotMessage(data.choices[0].message.content, [
          { label: ui[lang].reset, action: 'reset' }
        ]);
      } else {
        const errorText = data.error || (lang === 'ru' ? "Не удалось получить ответ" : "Failed to get response");
        renderBotMessage(`⚠️ ${errorText}`);
      }
    } catch (e) {
      chat.removeChild(chat.lastChild);
      renderBotMessage(lang === 'ru' ? "Ошибка сети. Попробуйте еще раз." : "Network issue. Please try again.");
    }
  }

  function switchLanguage() {
    lang = lang === 'ru' ? 'en' : 'ru';
    setupChat();
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendPrompt();
  });

  setupChat();
</script>
</body>
</html>
